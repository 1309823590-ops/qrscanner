<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QRスキャナー</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      margin: 0;
      padding: 16px;
      background: #f4f6f9;
      color: #1f2937;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
    }
    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }
    h1 {
      font-size: 1.2rem;
      margin: 0 0 12px;
    }
    .camera-box {
      background: #111827;
      border-radius: 10px;
      overflow: hidden;
      aspect-ratio: 4 / 3;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e5e7eb;
      padding: 12px;
      text-align: center;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-secondary { background: #e5e7eb; color: #111827; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .msg {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      background: #fee2e2;
      color: #991b1b;
      display: none;
    }
    .msg.show { display: block; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>QRコード読み取り</h1>
      <div class="camera-box">
        <video id="video" playsinline></video>
        <span id="placeholder">「カメラ開始」を押してQRコードをかざしてください</span>
      </div>
      <canvas id="canvas" style="display:none;"></canvas>

      <button id="startBtn" class="btn-primary" onclick="startCamera()">カメラ開始</button>
      <button id="stopBtn" class="btn-secondary" onclick="stopCamera()" disabled>カメラ停止</button>
      <div id="msg" class="msg"></div>
    </div>
  </div>

  <script>
    const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbyZKdj27UqMQDnxwJc3rNpiuHvlhxItJjRkepXgYlidCXHtjOFs-b1MZLFcsB7lhcd4/exec";

    let videoStream = null;
    let scanTimer = null;

    function showError(text) {
      const el = document.getElementById("msg");
      el.textContent = text;
      el.classList.add("show");
    }

    function clearError() {
      const el = document.getElementById("msg");
      el.textContent = "";
      el.classList.remove("show");
    }

    async function startCamera() {
      clearError();
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showError("このブラウザではカメラを利用できません。");
        return;
      }

      try {
        videoStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } },
          audio: false
        });
        const video = document.getElementById("video");
        video.srcObject = videoStream;
        await video.play();

        document.getElementById("placeholder").style.display = "none";
        document.getElementById("startBtn").disabled = true;
        document.getElementById("stopBtn").disabled = false;

        if (scanTimer) clearInterval(scanTimer);
        scanTimer = setInterval(scanFrame, 250);
      } catch (err) {
        showError("カメラを起動できませんでした（" + (err.name || "Error") + "）: " + (err.message || ""));
      }
    }

    function stopCamera() {
      if (scanTimer) {
        clearInterval(scanTimer);
        scanTimer = null;
      }
      if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
        videoStream = null;
      }
      document.getElementById("placeholder").style.display = "inline";
      document.getElementById("startBtn").disabled = false;
      document.getElementById("stopBtn").disabled = true;
    }

    function scanFrame() {
      const video = document.getElementById("video");
      if (video.readyState !== video.HAVE_ENOUGH_DATA) return;

      const canvas = document.getElementById("canvas");
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imgData.data, imgData.width, imgData.height, {
        inversionAttempts: "dontInvert"
      });

      if (code && code.data) {
        stopCamera();
        const sep = GAS_WEBAPP_URL.includes("?") ? "&" : "?";
        location.href = GAS_WEBAPP_URL + sep + "q=" + encodeURIComponent(code.data);
      }
    }
  </script>
</body>
</html>
